                      date_from: null
                      date_to_exclusive: null
                      time_from: null
                      time_to_exclusive: null
                      record_types: [task]
                      changes:
                        status: completed
                    context:
                      recent_messages:
                        - role: user
                          text: Отметь задачу купить билеты выполненной

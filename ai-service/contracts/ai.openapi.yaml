        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
        default:
          $ref: '#/components/responses/TechnicalError'
  /api/embed:
    post:
      tags: [AI]
      operationId: embedText
      summary: Получить вектор текста для поиска задач
      description: |
        Backend передаёт исходный текст записи (document) либо поискового
        запроса (query). AI-service применяет нужную для модели подготовку
        текста и возвращает L2-нормализованный вектор. Вызов не создаёт
        записи и не обращается к PostgreSQL или Redis.

        Векторы document и query сравнимы только при одинаковых model и
        model_version. Максимальный размер тела
        запроса — 16 КиБ.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmbeddingRequest'
            examples:
              document:
                summary: Текст сохранённой задачи
                value:
                  purpose: document
                  text: Подготовить презентацию для команды
              query:
                summary: Поисковый запрос пользователя
                value:
                  purpose: query
                  text: Найди задачу про слайды
      responses:
        '200':
          description: Вектор вычислен; длина и версия модели пригодны для проверки backend
          headers:
            Cache-Control:
              description: Ответ не должен сохраняться промежуточными кешами.
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmbeddingResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
        default:
          $ref: '#/components/responses/TechnicalError'
components:
  schemas:
    RespondRequest:
      type: object
      additionalProperties: false
      required: [user_id, task_id, text, timezone, intent, status, data]
      properties:
        user_id:
          type: string
          format: uuid
        task_id:
          type: string
          format: uuid
        text:
          type: string
          minLength: 1
          description: Текущая реплика пользователя.
        timezone:
          type: string
          minLength: 1
          example: Europe/Moscow
        intent:
          type: string
          enum: [create_event, list_events, search_events, on_delete, on_update]
        status:
          type: string
          enum: [ok, candidates, deleted, update_candidates, updated]
        data:
          type: object
          additionalProperties: true
          description: |
            Фактический data из ответа backend: event для создания; items для
            списка/поиска; candidates с number/event для выбора; candidates и
            changes для изменения; deleted_events или updated_events после
            успешного выполнения. Совпадает с соответствующим data в backend.openapi.yaml.
    RespondResponse:
      type: object
      additionalProperties: false
      required: [user_id, task_id, message]
      properties:
        user_id:
          type: string
          format: uuid
        task_id:
          type: string
          format: uuid
        message:
          type: string
          minLength: 1
          maxLength: 6000
    AIHealthResponse:
      type: object
      additionalProperties: false
      required: [service, status]
      properties:
        service:
          type: string
          enum: [ai-service]
        status:
          type: string
          enum: [ok]
    Problem:
      type: object
      additionalProperties: false
      description: Техническая ошибка в формате RFC 9457 с кодом приложения.
      required: [type, title, status, code]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
          format: int32
        code:
          type: string
        detail:
          type: string
        instance:
          type: string
    EmbeddingRequest:
      type: object
      additionalProperties: false
      required: [purpose, text]
      properties:
        purpose:
          type: string
          enum: [document, query]
          description: |
            Роль текста в поиске. Backend передаёт исходный текст без
            модельных префиксов; AI-service добавляет их при необходимости.
        text:
          type: string
          minLength: 1
          description: После удаления пробелов по краям строка должна быть непустой.
    EmbeddingResponse:
      type: object
      additionalProperties: false
      required: [embedding, model, model_version]
      properties:
        embedding:
          type: array
          minItems: 384
          maxItems: 384
          description: |
            L2-нормализованный вектор из 384 конечных чисел. Нулевой вектор
            недопустим. Backend проверяет размер и значения до записи в БД.
          items:
            type: number
            format: float
        model:
          type: string
          minLength: 1
          description: Идентификатор модели, использованной для вычисления вектора.
          example: intfloat/multilingual-e5-small
        model_version:
          type: string
          minLength: 1
          description: |
            Неизменяемый идентификатор версии весов, токенизатора и способа
            подготовки и нормализации. При изменении требуется переиндексация.
    JobRequest:
      type: object
      additionalProperties: false
      required: [user_id, task_id, text, request_time, timezone, context]
      properties:
        user_id:
          type: string
          format: uuid
        task_id:
          type: string
          format: uuid
          description: ID диалога; AI возвращает его без изменений.
        text:
          type: string
          minLength: 1
          description: Текст пользователя после STT или ввода на фронтенде.
        request_time:
          type: string
          format: date-time
          description: Время запроса в RFC 3339.
        timezone:
          type: string
          minLength: 1
          description: Часовой пояс пользователя в формате IANA.
          example: Europe/Moscow
        context:
          $ref: '#/components/schemas/JobRequestContext'
    JobRequestContext:
      description: |
        Пустой объект при первом запросе либо контекст из Redis при
        продолжении. После поиска on_delete/on_update backend передаёт AI
        список показанных пользователю кандидатов со стабильными номерами;
        для on_update draft также содержит предлагаемые changes.
        Формы контекста кандидатов могут совпасть, если частичный draft
        ещё не содержит changes, поэтому используется anyOf.
      anyOf:
        - $ref: '#/components/schemas/EmptyContext'
        - $ref: '#/components/schemas/StoredContext'
        - $ref: '#/components/schemas/DeleteCandidateContext'
        - $ref: '#/components/schemas/UpdateCandidateContext'
    EmptyContext:
      type: object
      additionalProperties: false
      maxProperties: 0
    StoredContext:
      type: object
      additionalProperties: false
      required: [recent_messages, draft]
      properties:
        recent_messages:
          $ref: '#/components/schemas/RecentMessages'
        draft:
          description: Частично собранные данные соответствующего intent.
          anyOf:
            - $ref: '#/components/schemas/CreateEventDraft'
            - $ref: '#/components/schemas/ListEventsDraft'
            - $ref: '#/components/schemas/SearchEventsDraft'
            - $ref: '#/components/schemas/DeleteSearchDraft'
            - $ref: '#/components/schemas/UpdateSearchDraft'
    DeleteCandidateContext:
      type: object
      additionalProperties: false
      required: [recent_messages, draft, candidates]
      description: |
        Контекст повторного запроса on_delete. Список создаёт backend из
        фактически показанных записей; пользователь может выбрать один,
        несколько или все показанные номера. Он не заменяет проверку кандидатов
        в Redis перед удалением; после пустого списка пользователь может
        уточнить признаки тем же task_id.
      properties:
        recent_messages:
          $ref: '#/components/schemas/RecentMessages'
        draft:
          $ref: '#/components/schemas/DeleteSearchDraft'
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/DeleteCandidate'
    DeleteCandidate:
      type: object
      additionalProperties: false
      required: [number, id, record_type, title, date, time, status]
      properties:
        number:
          type: integer
          minimum: 1
          description: Стабильный номер, показанный пользователю.
        id:
          type: string
          format: uuid
          description: ID строки tasks, не task_id диалога.
        record_type:
          $ref: '#/components/schemas/RecordType'
        title:
          type: string
          minLength: 1
        date:
          type: string
          format: date
          nullable: true
        time:
          type: string
          nullable: true
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
        status:
          type: string
          enum: [active, completed]
    RecentMessages:
      type: array
      description: AI использует и возвращает последние 20 сообщений; draft и candidates сохраняются отдельно. Более длинная входная история допускается, её начало не передаётся модели.
      minItems: 1
      items:
        $ref: '#/components/schemas/DialogueMessage'
    DialogueMessage:
      type: object
      additionalProperties: false
      required: [role, text]
      properties:
        role:
          type: string
          enum: [user, assistant]
        text:
          type: string
          minLength: 1
    JobResponse:
      description: |
        Бизнес-результат обработки реплики. Старые варианты несут intent
        в JSON; on_delete и on_update определяются по X-Task-Intent.
        Схемы уточнения для on_delete и on_update могут совпадать по JSON,
        поэтому здесь anyOf; заголовок различает их при HTTP-обмене.
      anyOf:
        - $ref: '#/components/schemas/NeedsClarificationResponse'
        - $ref: '#/components/schemas/ReadyResponse'
        - $ref: '#/components/schemas/DeleteNeedsClarificationResponse'
        - $ref: '#/components/schemas/DeleteFindCandidatesResponse'
        - $ref: '#/components/schemas/DeleteConfirmedResponse'
        - $ref: '#/components/schemas/UpdateClarification'
        - $ref: '#/components/schemas/UpdateFindCandidates'
        - $ref: '#/components/schemas/UpdateConfirmed'
    DeleteNeedsClarificationResponse:
      type: object
      additionalProperties: false
      required: [user_id, task_id, status, message, action, context]
      description: |
        Ответ on_delete с X-Task-Intent: on_delete. AI ещё не получил
        достаточно данных даже для поиска. Поле intent в JSON отсутствует.
      properties:
        user_id:
          type: string
          format: uuid
        task_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [needs_clarification]
        message:
          type: string
          minLength: 1
          description: Уточняющий вопрос для пользователя.
        action:
          type: object
          nullable: true
          enum: [null]
        context:
          $ref: '#/components/schemas/DeleteClarificationContext'
    DeleteClarificationContext:
      type: object
      additionalProperties: false
      required: [recent_messages, draft]
      properties:
        recent_messages:
          $ref: '#/components/schemas/RecentMessages'
        draft:
          $ref: '#/components/schemas/DeleteSearchDraft'
    DeleteFindCandidatesResponse:
      type: object
      additionalProperties: false
      required: [user_id, task_id, status, message, action, context]
      description: |
        Ответ on_delete с X-Task-Intent: on_delete. ready означает только
        готовность признаков для поиска. AI не видит PostgreSQL и не знает
        число кандидатов. После поиска backend передаёт результат в /api/respond;
        при сбое генерации использует резервное сообщение по числу кандидатов.
      properties:
        user_id:
          type: string
          format: uuid
        task_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [ready]
        message:
          type: string
          minLength: 1
          description: Сообщение AI о подготовке поиска, не итог удаления.
        action:
          $ref: '#/components/schemas/DeleteFindCandidatesAction'
        context:
          $ref: '#/components/schemas/ReadyContext'
    DeleteConfirmedResponse:
      type: object
      additionalProperties: false
      required: [user_id, task_id, status, message, action, context]
      description: |
        Ответ on_delete с X-Task-Intent: on_delete после явного выбора
        пользователя. Backend не доверяет task_ids без проверки каждого ID
        по сохранённым кандидатам и владельцу записей. Сообщение об успехе
        допустимо вернуть фронту только после удаления всех выбранных строк
        в PostgreSQL; частичное удаление недопустимо.
      properties:
        user_id:
          type: string
          format: uuid
        task_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [ready]
        message:
          type: string
          minLength: 1
        action:
          $ref: '#/components/schemas/DeleteConfirmedAction'
        context:
          $ref: '#/components/schemas/ReadyContext'
    NeedsClarificationResponse:
      oneOf:
        - $ref: '#/components/schemas/ClarificationCreateEvent'
        - $ref: '#/components/schemas/ClarificationListEvents'
        - $ref: '#/components/schemas/ClarificationSearchEvents'
    ClarificationBase:
      type: object
      required: [user_id, task_id, status, message, action]
      properties:
        user_id:
          type: string
          format: uuid
        task_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [needs_clarification]
        message:
          type: string
          minLength: 1
          description: Вопрос, который backend передаёт пользователю.
        action:
          type: object
          nullable: true
          enum: [null]
          description: При needs_clarification всегда null.
    ClarificationCreateEvent:
      allOf:
        - $ref: '#/components/schemas/ClarificationBase'
        - type: object
          required: [intent, context]
          properties:
            intent:
              type: string
              enum: [create_event]
            context:
              $ref: '#/components/schemas/CreateEventContext'
    ClarificationListEvents:
      allOf:
        - $ref: '#/components/schemas/ClarificationBase'
        - type: object
          required: [intent, context]
          properties:
            intent:
              type: string
              enum: [list_events]
            context:
              $ref: '#/components/schemas/ListEventsContext'
    ClarificationSearchEvents:
      allOf:
        - $ref: '#/components/schemas/ClarificationBase'
        - type: object
          required: [intent, context]
          properties:
            intent:
              type: string
              enum: [search_events]
            context:
              $ref: '#/components/schemas/SearchEventsContext'
    CreateEventContext:
      type: object
      additionalProperties: false
      required: [recent_messages, draft]
      properties:
        recent_messages:
          $ref: '#/components/schemas/RecentMessages'
        draft:
          $ref: '#/components/schemas/CreateEventDraft'
    ListEventsContext:
      type: object
      additionalProperties: false
      required: [recent_messages, draft]
      properties:
        recent_messages:
          $ref: '#/components/schemas/RecentMessages'
        draft:
          $ref: '#/components/schemas/ListEventsDraft'
    SearchEventsContext:
      type: object
      additionalProperties: false
      required: [recent_messages, draft]
      properties:
        recent_messages:
          $ref: '#/components/schemas/RecentMessages'
        draft:
          $ref: '#/components/schemas/SearchEventsDraft'
    CreateEventDraft:
      type: object
      additionalProperties: false
      description: Поля заполняются по мере уточнения.
      properties:
        record_type:
          $ref: '#/components/schemas/RecordType'
        title:
          type: string
          minLength: 1
        date:
          type: string
          format: date
        time:
          $ref: '#/components/schemas/LocalTime'
    ListEventsDraft:
      type: object
      additionalProperties: false
      properties:
        date_from:
          type: string
          format: date
        date_to_exclusive:
          type: string
          format: date
        record_types:
          $ref: '#/components/schemas/RecordTypes'
    SearchEventsDraft:
      type: object
      additionalProperties: false
      properties:
        query:
          type: string
          minLength: 1
        date_from:
          type: string
          format: date
        date_to_exclusive:
          type: string
          format: date
        record_types:
          $ref: '#/components/schemas/RecordTypes'
    DeleteSearchDraft:
      type: object
      additionalProperties: false
      description: |
        Частичные признаки on_delete. Незаданные поля могут отсутствовать
        или быть null. Сами по себе эти данные не разрешают удаление.
      properties:
        title_query:
          type: string
          minLength: 1
          nullable: true
        date_from:
          type: string
          format: date
          nullable: true
        date_to_exclusive:
          type: string
          format: date
          nullable: true
        time_from:
          type: string
          nullable: true
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
        time_to_exclusive:
          type: string
          nullable: true
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
        record_types:
          type: array
          nullable: true
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/RecordType'
    ReadyResponse:
      oneOf:
        - $ref: '#/components/schemas/ReadyCreateEvent'
        - $ref: '#/components/schemas/ReadyListEvents'
        - $ref: '#/components/schemas/ReadySearchEvents'
    ReadyBase:
      type: object
      required: [user_id, task_id, status, message, context]
      properties:
        user_id:
          type: string
          format: uuid
        task_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [ready]
        message:
          type: string
          minLength: 1
          description: |
            Резервное сообщение для пользователя от AI-service. После action
            backend запрашивает финальное сообщение через /api/respond.
            Для list_events и search_events резервное сообщение не утверждает,
            сколько записей найдено: /api/job ещё не видит результат БД.
            После удаления пробелов по краям строка должна быть непустой.
        context:
          $ref: '#/components/schemas/ReadyContext'
    ReadyContext:
      type: object
      additionalProperties: false
      required: [recent_messages, draft]
      properties:
        recent_messages:
          $ref: '#/components/schemas/RecentMessages'
        draft:
          type: object
          nullable: true
          enum: [null]
          description: При ready всегда null.
    ReadyCreateEvent:
      allOf:
        - $ref: '#/components/schemas/ReadyBase'
        - type: object
          required: [intent, action]
          properties:
            intent:
              type: string
              enum: [create_event]
            action:
              $ref: '#/components/schemas/CreateEventAction'
    ReadyListEvents:
      allOf:
        - $ref: '#/components/schemas/ReadyBase'
        - type: object
          required: [intent, action]
          properties:
            intent:
              type: string
              enum: [list_events]
            action:
              $ref: '#/components/schemas/ListEventsAction'
    ReadySearchEvents:
      allOf:
        - $ref: '#/components/schemas/ReadyBase'
        - type: object
          required: [intent, action]
          properties:
            intent:
              type: string
              enum: [search_events]
            action:
              $ref: '#/components/schemas/SearchEventsAction'
    CreateEventAction:
      description: |
        Для task обязательны record_type, title и date; time передаётся, только
        если указано или однозначно выведено время. Срок «до конца недели»
        означает воскресенье текущей недели без точного времени.
        Для meeting и reminder обязательны record_type, title, date и time.
        Backend проверяет переданные дату и время до сохранения.
      oneOf:
        - $ref: '#/components/schemas/TaskAction'
        - $ref: '#/components/schemas/TimedEventAction'
    TaskAction:
      type: object
      additionalProperties: false
      required: [record_type, title, date]
      properties:
        record_type:
          type: string
          enum: [task]
        title:
          type: string
          minLength: 1
        date:
          type: string
          format: date
        time:
          type: string
          nullable: true
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          description: Отсутствует или null, если задача не привязана к точному времени.
    TimedEventAction:
      type: object
      additionalProperties: false
      required: [record_type, title, date, time]
      properties:
        record_type:
          type: string
          enum: [meeting, reminder]
        title:
          type: string
          minLength: 1
        date:
          type: string
          format: date
        time:
          $ref: '#/components/schemas/LocalTime'
    ListEventsAction:
      type: object
      additionalProperties: false
      required: [date_from, date_to_exclusive]
      description: Backend проверяет date_from < date_to_exclusive.
      properties:
        date_from:
          type: string
          format: date
        date_to_exclusive:
          type: string
          format: date
        record_types:
          $ref: '#/components/schemas/RecordTypes'
    SearchEventsAction:
      type: object
      additionalProperties: false
      required: [query]
      description: |
        Backend ищет подстроку title без учёта регистра и дополняет результат
        семантически близкими записями при наличии совместимых embeddings.
        Для семантических совпадений учитываются владелец, типы и границы
        периода. При недоступности embeddings подстрочный поиск продолжает
        работать. Если указаны обе границы периода, backend проверяет
        date_from < date_to_exclusive; записи без даты не попадают в выборку
        с фильтром по дате. AI сохраняет значимую часть запроса, например
        имя в «встрече с Иваном», чтобы не искать все встречи подряд.
      properties:
        query:
          type: string
          minLength: 1
          description: После удаления пробелов по краям строка должна быть непустой.
        date_from:
          type: string
          format: date
        date_to_exclusive:
          type: string
          format: date
        record_types:
          $ref: '#/components/schemas/RecordTypes'
    DeleteFindCandidatesAction:
      type: object
      additionalProperties: false
      required:
        - phase
        - title_query
        - date_from
        - date_to_exclusive
        - time_from
        - time_to_exclusive
        - record_types
      description: |
        Поиск кандидатов на удаление без изменения БД. Все признаки
        присутствуют, незаданные равны null. Хотя бы один признак должен
        быть ненулевым. Backend применяет заполненные точные фильтры
        совместно (AND). title_query используется для поиска по заголовку,
        в том числе семантического при доступных совместимых embeddings.
        Отсутствие даты допускает поиск по времени среди всех дат.
        date_from и time_from включительны, date_to_exclusive и
        time_to_exclusive исключительны. Если заданы обе границы одного
        интервала, backend проверяет from < to. Относительные даты AI
        переводит в календарные по request_time и timezone.
      anyOf:
        - required: [title_query]
          properties:
            title_query:
              type: string
              minLength: 1
        - required: [date_from]
          properties:
            date_from:
              type: string
              format: date
        - required: [date_to_exclusive]
          properties:
            date_to_exclusive:
              type: string
              format: date
        - required: [time_from]
          properties:
            time_from:
              type: string
              pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
        - required: [time_to_exclusive]
          properties:
            time_to_exclusive:
              type: string
              pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
        - required: [record_types]
          properties:
            record_types:
              type: array
              minItems: 1
      properties:
        phase:
          type: string
          enum: [find_candidates]
        title_query:
          type: string
          minLength: 1
          nullable: true
        date_from:
          type: string
          format: date
          nullable: true
        date_to_exclusive:
          type: string
          format: date
          nullable: true
        time_from:
          type: string
          nullable: true
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
        time_to_exclusive:
          type: string
          nullable: true
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
        record_types:
          type: array
          nullable: true
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/RecordType'
    DeleteConfirmedAction:
      type: object
      additionalProperties: false
      required: [phase, task_ids]
      description: |
        AI сопоставляет подтверждённые пользователем номера со стабильными
        ID кандидатов из JobRequestContext. task_ids содержит ID строк
        PostgreSQL tasks, а верхнеуровневый task_id — ID диалога. Backend
        проверяет весь список по сохранённым кандидатам и владельцу
        действующей Bearer-сессии. Если хотя бы один ID невалиден или
        устарел, ни одна строка не удаляется.
      properties:
        phase:
          type: string
          enum: [delete_confirmed]
        task_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            format: uuid
    RecordType:
      type: string
      enum: [task, reminder, meeting]
    RecordTypes:
      type: array
      minItems: 1
      uniqueItems: true
      description: Если поле отсутствует, backend учитывает все типы.
      items:
        $ref: '#/components/schemas/RecordType'
    LocalTime:
      type: string
      pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
      example: '15:00'
    UUID:
      type: string
      format: uuid
    Date:
      type: string
      format: date
    TaskStatus:
      type: string
      enum: [active, completed]
    UpdateChanges:
      type: object
      additionalProperties: false
      minProperties: 1
      description: |
        Только переданные поля меняются. Отсутствие поля сохраняет прежнее
        значение; null запрещён. Одного changes.time достаточно для переноса
        времени существующей встречи: её дата сохраняется. Одного changes.date
        достаточно для переноса даты: время сохраняется. Не нужно запрашивать
        неизменяемые поля до поиска кандидатов. record_type, user_id, id и created_at
        неизменяемы. Если time задано для записи без date, changes обязано
        задать date. Дату без времени и время без даты можно сохранять только
        если итоговая строка удовлетворяет ограничению БД.
      properties:
        title:
          type: string
          minLength: 1
          description: После trim строка должна быть непустой.
        date: {$ref: '#/components/schemas/Date'}
        time: {$ref: '#/components/schemas/LocalTime'}
        status: {$ref: '#/components/schemas/TaskStatus'}
    UpdateSearchDraft:
      type: object
      additionalProperties: false
      description: Частично собранные признаки поиска и новое состояние.
      properties:
        title_query:
          type: string
          minLength: 1
          nullable: true
        date_from:
          type: string
          format: date
          nullable: true
        date_to_exclusive:
          type: string
          format: date
          nullable: true
        time_from:
          type: string
          nullable: true
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
        time_to_exclusive:
          type: string
          nullable: true
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
        record_types:
          type: array
          nullable: true
          minItems: 1
          uniqueItems: true
          items: {$ref: '#/components/schemas/RecordType'}
        changes:
          type: object
          additionalProperties: false
          description: Частичные изменения для needs_clarification.
          properties:
            title: {type: string, minLength: 1}
            date: {$ref: '#/components/schemas/Date'}
            time: {$ref: '#/components/schemas/LocalTime'}
            status: {$ref: '#/components/schemas/TaskStatus'}
    UpdateFindAction:
      type: object
      additionalProperties: false
      required: [phase, title_query, date_from, date_to_exclusive, time_from, time_to_exclusive, record_types, changes]
      description: |
        Все фильтры присутствуют, неизвестные равны null. Требуется хотя бы
        один ненулевой фильтр. Заполненные фильтры объединяются через AND;
        нижние границы включаются, верхние исключаются. При title_query
        допустимо семантическое дополнение поиска по той же модели векторов.
        При обеих границах date_from < date_to_exclusive и
        time_from < time_to_exclusive. changes содержит хотя бы одно поле.
      properties:
        phase: {type: string, enum: [find_candidates]}
        title_query: {type: string, minLength: 1, nullable: true}
        date_from: {type: string, format: date, nullable: true}
        date_to_exclusive: {type: string, format: date, nullable: true}
        time_from:
          type: string
          nullable: true
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
        time_to_exclusive:
          type: string
          nullable: true
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
        record_types:
          type: array
          nullable: true
          minItems: 1
          uniqueItems: true
          items: {$ref: '#/components/schemas/RecordType'}
        changes: {$ref: '#/components/schemas/UpdateChanges'}
      anyOf:
        - required: [title_query]
          properties: {title_query: {type: string}}
        - required: [date_from]
          properties: {date_from: {type: string}}
        - required: [date_to_exclusive]
          properties: {date_to_exclusive: {type: string}}
        - required: [time_from]
          properties: {time_from: {type: string}}
        - required: [time_to_exclusive]
          properties: {time_to_exclusive: {type: string}}
        - required: [record_types]
          properties: {record_types: {type: array}}
    UpdateConfirmedAction:
      type: object
      additionalProperties: false
      required: [phase, record_ids]
      description: |
        AI переводит selected_numbers в ID из context.candidates; никакие
        изменения из LLM повторно не принимаются. Backend использует
        сохранённые в Redis changes и сравнивает текущие строки с показанными.
      properties:
        phase: {type: string, enum: [update_confirmed]}
        record_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items: {$ref: '#/components/schemas/UUID'}
    UpdateCandidate:
      type: object
      additionalProperties: false
      required: [number, id, record_type, title, date, time, status]
      properties:
        number: {type: integer, minimum: 1}
        id: {$ref: '#/components/schemas/UUID'}
        record_type: {$ref: '#/components/schemas/RecordType'}
        title: {type: string, minLength: 1}
        date: {type: string, format: date, nullable: true}
        time:
          type: string
          nullable: true
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
        status: {$ref: '#/components/schemas/TaskStatus'}
    UpdateClarificationContext:
      type: object
      additionalProperties: false
      required: [recent_messages, draft]
      properties:
        recent_messages:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/DialogueMessage'}
        draft: {$ref: '#/components/schemas/UpdateSearchDraft'}
    UpdateCandidateContext:
      type: object
      additionalProperties: false
      required: [recent_messages, draft, candidates]
      description: |
        Backend записывает в Redis показанные номера, ID, полные снимки
        записей и changes. AI получает только необходимые для выбора поля;
        backend повторно сверяет ID и снимки перед записью в PostgreSQL.
      properties:
        recent_messages:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/DialogueMessage'}
        draft: {$ref: '#/components/schemas/UpdateSearchDraft'}
        candidates:
          type: array
          items: {$ref: '#/components/schemas/UpdateCandidate'}
    UpdateReadyContext:
      type: object
      additionalProperties: false
      required: [recent_messages, draft]
      properties:
        recent_messages:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/DialogueMessage'}
        draft:
          type: object
          nullable: true
          enum: [null]
    UpdateClarification:
      type: object
      additionalProperties: false
      required: [user_id, task_id, status, message, action, context]
      properties:
        user_id: {$ref: '#/components/schemas/UUID'}
        task_id: {$ref: '#/components/schemas/UUID'}
        status: {type: string, enum: [needs_clarification]}
        message: {type: string, minLength: 1}
        action:
          type: object
          nullable: true
          enum: [null]
        context: {$ref: '#/components/schemas/UpdateClarificationContext'}
    UpdateFindCandidates:
      type: object
      additionalProperties: false
      required: [user_id, task_id, status, message, action, context]
      properties:
        user_id: {$ref: '#/components/schemas/UUID'}
        task_id: {$ref: '#/components/schemas/UUID'}
        status: {type: string, enum: [ready]}
        message: {type: string, minLength: 1}
        action: {$ref: '#/components/schemas/UpdateFindAction'}
        context: {$ref: '#/components/schemas/UpdateReadyContext'}
    UpdateConfirmed:
      type: object
      additionalProperties: false
      required: [user_id, task_id, status, message, action, context]
      properties:
        user_id: {$ref: '#/components/schemas/UUID'}
        task_id: {$ref: '#/components/schemas/UUID'}
        status: {type: string, enum: [ready]}
        message: {type: string, minLength: 1}
        action: {$ref: '#/components/schemas/UpdateConfirmedAction'}
        context: {$ref: '#/components/schemas/UpdateReadyContext'}
  responses:
    BadRequest:
      description: Некорректный JSON или нарушен контракт запроса
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PayloadTooLarge:
      description: Тело запроса превышает 16 КиБ
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnsupportedMediaType:
      description: Content-Type отличается от application/json
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalError:
      description: Внутренняя ошибка AI-service
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unavailable:
      description: Модель или необходимая зависимость временно недоступна
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    GatewayTimeout:
      description: Превышен лимит времени обработки запроса
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TechnicalError:
      description: Другая техническая ошибка HTTP 4xx/5xx
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

openapi: 3.0.3
info:
  title: GorkyCode AI Service API
  version: 1.0.0
  description: |
    Внутренний контракт backend ↔ AI-service. Backend передаёт уже распознанный
    или введённый текст. AI определяет intent и возвращает данные для уточнения
    либо action. AI не читает Redis и не выполняет действия в PostgreSQL.
paths:
  /api/respond:
    post:
      tags: [AI]
      operationId: respondToResult
      summary: Сформулировать ответ по фактическому результату backend
      description: |
        Вызывается после выполнения операции или поиска кандидатов в БД.
        AI формирует только message, не выполняет action и не меняет данные.
        При candidates/update_candidates требуется выбор номеров пользователем;
        удаление/изменение ещё не выполнено. При ошибке или таймауте генерации
        backend сохраняет успешный результат и возвращает резервное сообщение.
        Генерация ограничена 25 секундами. Провайдер получает только text,
        timezone, intent, status и отображаемые поля; UUID и технические поля
        не передаются. Списки для модели сокращаются до 50 элементов с полным
        количеством в total_counts; данные фронтенду передаются полностью.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RespondRequest'
            example:
              user_id: b80e93e1-9945-48e0-8460-3ee68bcfb402
              task_id: 7b612951-57ae-4ac4-a93c-42fa9c9e8359
              text: Найди встречи с Иваном
              timezone: Europe/Moscow
              intent: search_events
              status: ok
              data:
                items: []
      responses:
        '200':
          description: Человеческий ответ с исходными ID пользователя и диалога
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespondResponse'
              example:
                user_id: b80e93e1-9945-48e0-8460-3ee68bcfb402
                task_id: 7b612951-57ae-4ac4-a93c-42fa9c9e8359
                message: Встреч с Иваном не нашлось. Попробуем другой запрос?
        '400':
          description: Невалидный запрос
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '502':
          description: Модель вернула некорректный ответ
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: Провайдер модели недоступен
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '504':
          description: Истекло время генерации ответа
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /health:
    get:
      tags: [Service]
      operationId: aiHealth
      summary: Проверить, что процесс AI-service работает
      responses:
        '200':
          description: Процесс работает
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIHealthResponse'
              example:
                service: ai-service
                status: ok
  /api/job:
    post:
      tags: [AI]
      operationId: processJob
      summary: Определить намерение и подготовить действие
      description: |
        user_id и task_id возвращаются без изменений. Относительные даты
        вычисляются по request_time и timezone. При needs_clarification
        backend сохраняет context и задаёт пользователю message. При ready
        backend валидирует action и выполняет его. Затем запрашивает message
        через POST /api/respond по фактическому результату БД. Текст /api/job
        остаётся резервным для создания, списка, поиска и изменения. Для
        кандидатов и удаления backend имеет резервный текст по количеству строк.
        При задаче со сроком без точного времени action.time отсутствует или
        равен null; backend сохраняет такую задачу без времени.
        Если пользователь сменил тему во время уточнения, AI не переносит
        старый draft в новое действие и возвращает context только новой темы.
        user_id и task_id при этом остаются прежними; backend перезаписывает
        черновик либо завершает диалог по обычным правилам status.
        Для on_delete и on_update AI возвращает intent только в заголовке
        X-Task-Intent; в JSON этих ответов поля intent нет.
        Подтверждение относится только к текущему показанному списку и его
        операции. Вопрос с номером записи, время, отрицание или команда
        другого действия не являются подтверждением удаления/изменения.
        Существующие create_event, list_events и search_events продолжают
        возвращать intent в JSON без обязательного X-Task-Intent.
        ready/on_delete с phase=find_candidates разрешает только поиск:
        удаление возможно лишь после повторного запроса с подтверждением
        пользователя и phase=delete_confirmed. AI сопоставляет выбранные
        номера с ID строк tasks и возвращает их в action.task_ids. Backend
        проверяет все ID по сохранённому списку кандидатов и владельцу
        сессии; удаление выбранных строк выполняется одной транзакцией.
        on_update использует такие же две фазы; changes сохраняются до показа
        кандидатов, а update_confirmed содержит ID выбранных строк.
        Технические ошибки передаются HTTP 4xx/5xx, а не бизнес-статусом.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobRequest'
            examples:
              firstRequest:
                summary: Первая реплика
                value:
                  user_id: b80e93e1-9945-48e0-8460-3ee68bcfb402
                  task_id: 7b612951-57ae-4ac4-a93c-42fa9c9e8359
                  text: Назначь встречу с Иваном завтра
                  request_time: '2026-10-18T12:00:00+03:00'
                  timezone: Europe/Moscow
                  context: {}
              dateOnlyTask:
                summary: Задача со сроком без точного времени
                value:
                  user_id: b80e93e1-9945-48e0-8460-3ee68bcfb402
                  task_id: 8513f479-309c-4816-b5bc-53c1217c5571
                  text: Поставь задачу купить билеты до конца недели
                  request_time: '2026-10-26T12:00:00+03:00'
                  timezone: Europe/Moscow
                  context: {}
              clarificationReply:
                summary: Ответ на уточнение
                value:
                  user_id: b80e93e1-9945-48e0-8460-3ee68bcfb402
                  task_id: 7b612951-57ae-4ac4-a93c-42fa9c9e8359
                  text: 'В 15:00'
                  request_time: '2026-10-18T12:00:20+03:00'
                  timezone: Europe/Moscow
                  context:
                    recent_messages:
                      - role: user
                        text: Назначь встречу с Иваном завтра
                      - role: assistant
                        text: В какое время?
                    draft:
                      record_type: meeting
                      title: Встреча с Иваном
                      date: '2026-10-19'
              contextSwitch:
                summary: Новая тема вместо ответа на вопрос о встрече
                value:
                  user_id: b80e93e1-9945-48e0-8460-3ee68bcfb402
                  task_id: 7b612951-57ae-4ac4-a93c-42fa9c9e8359
                  text: Создай задачу купить молоко завтра в 18:00
                  request_time: '2026-10-18T12:01:00+03:00'
                  timezone: Europe/Moscow
                  context:
                    recent_messages:
                      - role: user
                        text: Назначь встречу с Иваном завтра
                      - role: assistant
                        text: В какое время?
                    draft:
                      record_type: meeting
                      title: Встреча с Иваном
                      date: '2026-10-19'
              deleteSelection:
                summary: Пользователь выбирает две записи из показанного списка
                value:
                  user_id: b80e93e1-9945-48e0-8460-3ee68bcfb402
                  task_id: 70ce187e-a2a6-4499-91a0-5c61e5920b51
                  text: Удали №1 и №5
                  request_time: '2026-10-23T14:03:00+03:00'
                  timezone: Europe/Moscow
                  context:
                    recent_messages:
                      - role: user
                        text: Удали встречи с Иваном сегодня
                      - role: assistant
                        text: Нашёл пять встреч. Какие удалить?
                    draft:
                      title_query: встречи с Иваном
                      date_from: '2026-10-23'
                      date_to_exclusive: '2026-10-24'
                    candidates:
                      - number: 1
                        id: 2d7f8e0b-2fae-4b46-835a-675f748f3b11
                        record_type: meeting
                        title: Встреча с Иваном
                        date: '2026-10-23'
                        time: '11:00'
                        status: active
                      - number: 2
                        id: 0e083fa1-c33e-4c44-85e6-5b977ae17808
                        record_type: meeting
                        title: Встреча с Иваном
                        date: '2026-10-23'
                        time: '15:00'
                        status: active
                      - number: 3
                        id: 6a59a6cb-6d5f-4f1e-b1d5-2e2c944acf55
                        record_type: meeting
                        title: Встреча с Иваном
                        date: '2026-10-23'
                        time: '16:00'
                        status: active
                      - number: 4
                        id: 7b860b25-b89c-43b4-9b88-b0dcb8493a78
                        record_type: meeting
                        title: Встреча с Иваном
                        date: '2026-10-23'
                        time: '17:00'
                        status: active
                      - number: 5
                        id: ee79bdbf-f5a8-4204-a821-4a4ab21d14f6
                        record_type: meeting
                        title: Встреча с Иваном
                        date: '2026-10-23'
                        time: '18:00'
                        status: active
              updateSelection:
                summary: Выбор показанной задачи без точного времени
                value:
                  user_id: b80e93e1-9945-48e0-8460-3ee68bcfb402
                  task_id: 98fa7a94-7473-40b2-8678-11d3c1662eed
                  text: Выбери №1
                  request_time: '2026-10-26T12:02:00+03:00'
                  timezone: Europe/Moscow
                  context:
                    recent_messages:
                      - role: user
                        text: Отметь задачу купить билеты выполненной
                      - role: assistant
                        text: 'Поиск завершён. Найдено записей: 1. Какие изменить?'
                    draft:
                      title_query: купить билеты
                      changes:
                        status: completed
                    candidates:
                      - number: 1
                        id: ef906c03-d7c2-41d6-bac4-694db14cc07a
                        record_type: task
                        title: Купить билеты
                        date: '2026-11-01'
                        time: null
                        status: active
      responses:
        '200':
          description: |
            Требуется уточнение либо подготовлено действие. Заголовок
            X-Task-Intent обязателен для ответов on_delete и on_update;
            прежние интенты по-прежнему находятся в JSON. OpenAPI 3.0 не
            выражает условную обязательность заголовка для одного HTTP 200,
            поэтому это правило проверяется при интеграции.
          headers:
            X-Task-Intent:
              description: |
                Только для on_delete/on_update: подтверждённый AI intent. В старых
                ответах заголовок не требуется.
              required: false
              schema:
                type: string
                enum: [on_delete, on_update]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobResponse'
              examples:
                needsClarification:
                  summary: AI просит указать время
                  value:
                    user_id: b80e93e1-9945-48e0-8460-3ee68bcfb402
                    task_id: 7b612951-57ae-4ac4-a93c-42fa9c9e8359
                    status: needs_clarification
                    intent: create_event
                    message: В какое время?
                    action: null
                    context:
                      recent_messages:
                        - role: user
                          text: Назначь встречу с Иваном завтра
                        - role: assistant
                          text: В какое время?
                      draft:
                        record_type: meeting
                        title: Встреча с Иваном
                        date: '2026-10-19'
                readyCreateEvent:
                  summary: Встреча готова к созданию
                  value:
                    user_id: b80e93e1-9945-48e0-8460-3ee68bcfb402
                    task_id: 7b612951-57ae-4ac4-a93c-42fa9c9e8359
                    status: ready
                    intent: create_event
                    message: Встреча с Иваном назначена на завтра в 15:00.
                    action:
                      record_type: meeting
                      title: Встреча с Иваном
                      date: '2026-10-19'
                      time: '15:00'
                    context:
                      recent_messages:
                        - role: user
                          text: Назначь встречу с Иваном завтра
                        - role: assistant
                          text: В какое время?

[build-system]
requires = ["setuptools>=75,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "gorkycode-ai-service"
version = "1.0.0"
description = "FastAPI service for interpreting calendar requests through Cloud.ru Foundation Models"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.6,<3",
    "openai>=2,<3",
    "httpx>=0.28,<1",
    "uvicorn>=0.32,<1",
    "httptools>=0.8,<1",
    "uvloop>=0.15,<1; sys_platform != 'win32' and sys_platform != 'cygwin' and platform_python_implementation != 'PyPy'",
    "PyYAML>=6,<7",
    "tzdata>=2025.1",
    "torch==2.10.0+cpu",
    "transformers==4.57.6",
    "numpy==2.2.6",
    "sentencepiece==0.2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<10",
    "openapi-schema-validator>=0.6,<1",
    "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
app = ["resources/*.yaml"]
"app.llm" = ["prompts/*.txt"]
"app.embeddings" = ["manifest.json"]
"app.security" = ["prompts/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

  /api/v1/auth/sign-up:
    post:
      tags: [Auth]
      summary: Регистрация пользователя
      description: Создаёт пользователя и возвращает access token. Email сравнивается без учёта регистра.
      operationId: authSignUp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignUpRequest'
      responses:
        '201':
          description: Пользователь создан и авторизован
          headers:
            Cache-Control:
              description: Ответ с токеном не должен кешироваться.
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/auth/sign-in:
    post:
      tags: [Auth]
      summary: Вход по email и паролю
      description: Возвращает одинаковую ошибку при неизвестном email и неверном пароле.
      operationId: authSignIn
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignInRequest'
      responses:
        '200':
          description: Пользователь авторизован
          headers:
            Cache-Control:
              description: Ответ с токеном не должен кешироваться.
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/auth/sign-out:
    post:
      tags: [Auth]
      summary: Выход из аккаунта
      description: >-
        Завершает сессию, к которой привязан переданный access token. После
        этого токен больше не принимается. Повторный вызов с тем же токеном
        возвращает 401, так как сессии уже нет.
      operationId: authSignOut
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Сессия завершена
        '401':
          $ref: '#/components/responses/SessionRequired'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Access token, полученный из sign-up или sign-in.
  schemas:
    TaskTextRequest:
      type: object
      additionalProperties: false
      required: [user_id, text]
      properties:
        user_id:
          type: string
          format: uuid
          description: Должен совпадать с владельцем Bearer-сессии.
        task_id:
          type: string
          format: uuid
          description: |
            Передаётся при ответе на уточнение или выборе кандидата
            on_delete/on_update.
            Backend ищет context в Redis по паре user_id и task_id.
        text:
          type: string
          minLength: 1
          description: После удаления пробелов по краям строка должна быть непустой.
    TaskAudioRequest:
      type: object
      additionalProperties: false
      required: [user_id, file]
      properties:
        user_id:
          type: string
          format: uuid
          description: Текстовое поле multipart/form-data; должен совпадать с владельцем Bearer-сессии.
        task_id:
          type: string
          format: uuid
          description: Необязательное текстовое поле для продолжения диалога, включая on_delete/on_update.
        file:
          type: string
          format: binary
          description: |
            WAV-аудио (.wav или .wave). Максимальный размер задаётся
            конфигурацией backend; другие аудиоформаты отклоняются.
    TaskClarificationResponse:
      type: object
      additionalProperties: false
      required: [user_id, task_id, status, message]
      properties:
        user_id:
          type: string
          format: uuid
        task_id:
          type: string
          format: uuid
          description: Клиент возвращает этот ID в следующем запросе.
        status:
          type: string
          enum: [needs_clarification]
        message:
          type: string
          minLength: 1
          description: Уточняющий вопрос от AI-service.
    TaskDeleteCandidatesResponse:
      type: object
      additionalProperties: false
      required: [user_id, task_id, status, message, data]
      description: |
        Ответ on_delete после поиска. Список кандидатов формирует backend
        только из записей владельца действующей сессии. Он возвращается
        даже при одном кандидате; пустой массив означает, что нужен новый
        текст с уточнёнными признаками и тем же task_id. Пользователь может
        выбрать один, несколько или все показанные номера. Список с номерами
        сохраняется в Redis до подтверждения.
      properties:
        user_id:
          type: string
          format: uuid
        task_id:
          type: string
          format: uuid
          description: ID диалога для следующего запроса, не ID строки tasks.
        status:
          type: string
          enum: [candidates]
        message:
          type: string
          minLength: 1
          description: Сообщение backend после фактического поиска.
        data:
          $ref: '#/components/schemas/TaskDeleteCandidatesData'
    TaskDeleteCandidatesData:
      type: object
      additionalProperties: false
      required: [candidates]
      properties:
        candidates:
          type: array
          description: Все найденные записи со стабильными номерами.
          items:
            $ref: '#/components/schemas/TaskDeleteCandidate'
    TaskDeleteCandidate:
      type: object
      additionalProperties: false
      required: [number, event]
      properties:
        number:
          type: integer
          minimum: 1
          description: Номер для ответа пользователя, стабильный в этом диалоге.
        event:
          $ref: '#/components/schemas/TaskItem'
    TasksDeletedResponse:
      type: object
      additionalProperties: false
      required: [user_id, task_id, status, message, data]
      description: |
        Ответ on_delete только после удаления всех выбранных строк пользователя
        в PostgreSQL одной транзакцией. Backend проверяет каждый ID из
        action.task_ids по сохранённому списку кандидатов и владельцу сессии;
        при устаревшем выборе возвращает 409 без частичного удаления.
      properties:
        user_id:
          type: string
          format: uuid
        task_id:
          type: string
          format: uuid
          description: ID диалога, не ID удалённой строки tasks.
        status:
          type: string
          enum: [deleted]
        message:
          type: string
          minLength: 1
          description: Сообщение backend об успешно удалённых записях.
        data:
          $ref: '#/components/schemas/TasksDeletedData'
    TasksDeletedData:
      type: object
      additionalProperties: false
      required: [deleted_events]
      properties:
        deleted_events:
          type: array
          minItems: 1
          description: Все удалённые строки tasks, в порядке подтверждённых ID.
          items:
            $ref: '#/components/schemas/TaskItem'
    TaskCreatedResponse:
      type: object
      additionalProperties: false
      required: [user_id, task_id, status, message, data]
      properties:
        user_id:
          type: string
          format: uuid
        task_id:
          type: string
          format: uuid
          description: ID обработки диалога; не является ID созданной записи.
        status:
          type: string
          enum: [ok]
        message:
          type: string
          minLength: 1
          description: Сообщение AI-service, переданное backend без изменений после успешного сохранения.
        data:
          $ref: '#/components/schemas/TaskCreatedData'
    TaskCreatedData:
      type: object
      additionalProperties: false
      required: [event]
      properties:
        event:
          $ref: '#/components/schemas/TaskCreatedEvent'
    TaskCreatedEvent:
      type: object
      additionalProperties: false
      required: [id, user_id, record_type, title, date, created_at, status]
      description: |
        Полная созданная запись. record_type совпадает со значением колонки
        tasks.type в PostgreSQL. Для новых записей date обязательна. time
        обязательно для meeting/reminder и может отсутствовать у task.
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        record_type:
          type: string
          enum: [task, reminder, meeting]
        title:
          type: string
          minLength: 1
        date:
          type: string
          format: date
        time:
          type: string
          nullable: true
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          description: Отсутствует или null, если задача не привязана к точному времени.
        created_at:
          type: string
          format: date-time
        status:
          type: string
          enum: [active]
    TaskCollectionResponse:
      type: object
      additionalProperties: false
      required: [user_id, task_id, status, message, data]
      description: |
        Ответ фронтенду после выполнения list_events или search_events.
        Агрегатор добавляет user_id, task_id и status к результату внутреннего
        сервиса в data и передаёт message от AI-service без изменений.
      properties:
        user_id:
          type: string
          format: uuid
        task_id:
          type: string
          format: uuid
          description: ID обработки запроса; новую запись tasks не обозначает.
        status:
          type: string
          enum: [ok]
        message:
          type: string
          minLength: 1
          description: |
            Сообщение AI-service, переданное backend без изменений после
            успешного выполнения поиска или получения списка. Количество
            записей и наличие совпадений определяются по data.items.
        data:
          $ref: '#/components/schemas/TaskCollection'
    TaskCollection:
      type: object
      additionalProperties: false
      required: [items]
      description: |
        Результат, который внутренние Go-сервисы list_events и search_events
        возвращают агрегатору. Записи берутся из PostgreSQL и ограничены
        user_id текущего запроса. Сервисы возвращают только items;
        агрегатор формирует обёртку ответа фронтенду и передаёт message от
        AI-service без изменений.
        Если записей нет, items — пустой массив. Оба сервиса учитывают
        записи со статусами active и completed. Задача без точного времени
        участвует в выборке по дате; отсутствие времени не заменяется
        фиктивным часом.
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TaskItem'
      example:
        items:
          - id: 0e083fa1-c33e-4c44-85e6-5b977ae17808
            user_id: b80e93e1-9945-48e0-8460-3ee68bcfb402
            record_type: meeting
            title: Встреча с Иваном
            date: '2026-10-19'
            time: '15:00'
            created_at: '2026-10-18T12:00:20+03:00'
            status: active
    TaskItem:
      type: object
      additionalProperties: false
      required: [id, user_id, record_type, title, created_at, status]
      description: |
        Представление записи tasks для клиента. Значения record_type на API
        совпадают с AI-контрактом и со значениями колонки tasks.type
        в PostgreSQL (meeting, task, reminder).
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        record_type:
          type: string
          enum: [task, reminder, meeting]
        title:
          type: string
          minLength: 1
        date:
          type: string
          format: date
          nullable: true
          description: Отсутствует или null, если дата не задана.
        time:
          type: string
          nullable: true
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          description: Локальное время HH:MM; отсутствует или null, если не задано.
        created_at:
          type: string
          format: date-time
        status:
          type: string
          enum: [active, completed]
    UUID:
      type: string
      format: uuid
    RecordType:
      type: string
      enum: [task, reminder, meeting]
    TaskStatus:
      type: string
      enum: [active, completed]
    Date:
      type: string
      format: date
    LocalTime:
      type: string
      pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
    UpdateChanges:
      type: object
      additionalProperties: false
      minProperties: 1
      description: |
        Только переданные поля меняются. Отсутствие поля сохраняет прежнее
        значение; null запрещён. record_type, user_id, id и created_at
        неизменяемы. Если time задано для записи без date, changes обязано
        задать date. Дату без времени и время без даты можно сохранять только
        если итоговая строка удовлетворяет ограничению БД.
      properties:
        title:
          type: string
          minLength: 1
          description: После trim строка должна быть непустой.
        date: {$ref: '#/components/schemas/Date'}
        time: {$ref: '#/components/schemas/LocalTime'}
        status: {$ref: '#/components/schemas/TaskStatus'}
    FrontendUpdateCandidates:
      type: object
      additionalProperties: false
      required: [user_id, task_id, status, message, data]
      description: |
        Результат on_update/find_candidates. Backend сохраняет показанные
        номера, снимки записей и changes в Redis. Даже при нуле или одном
        совпадении возвращаются candidates и changes; изменений в БД пока нет.
        Для подтверждения клиент передаёт выбранные номера текстом с тем же
        task_id. message о количестве кандидатов формирует backend.
      properties:
        user_id: {$ref: '#/components/schemas/UUID'}
        task_id: {$ref: '#/components/schemas/UUID'}
        status: {type: string, enum: [update_candidates]}
        message: {type: string, minLength: 1}
        data:
          type: object
          additionalProperties: false
          required: [candidates, changes]
          properties:
            candidates:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [number, event]
                properties:
                  number: {type: integer, minimum: 1}
                  event: {$ref: '#/components/schemas/TaskItem'}
            changes: {$ref: '#/components/schemas/UpdateChanges'}
    FrontendUpdated:
      type: object
      additionalProperties: false
      required: [user_id, task_id, status, message, data]
      description: |
        Результат on_update/update_confirmed после проверки выбранных ID и
        снимков, затем атомарной записи в PostgreSQL. Устаревший выбор даёт
        HTTP 409 без частичного изменения. message от AI-service передаётся
        после успешной записи.
      properties:
        user_id: {$ref: '#/components/schemas/UUID'}
        task_id: {$ref: '#/components/schemas/UUID'}
        status: {type: string, enum: [updated]}
        message: {type: string, minLength: 1}
        data:
          type: object
          additionalProperties: false
          required: [updated_events]
          properties:
            updated_events:
              type: array
              minItems: 1
              description: Полные записи после commit, в порядке выбранных ID.
              items: {$ref: '#/components/schemas/TaskItem'}
    SignUpRequest:
      type: object
      additionalProperties: false
      required: [name, email, password, timezone]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Отображаемое имя пользователя; строка из одних пробелов недопустима.
          example: Артём
        email:
          type: string
          format: email
          maxLength: 320
          description: Уникальный email; при регистрации пробелы по краям удаляются, регистр не учитывается.
          example: artem@example.com
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 15
          maxLength: 128
          description: Пароль передаётся только по HTTPS и никогда не возвращается в ответе.
        timezone:
          type: string
          description: Часовой пояс IANA для интерпретации относительных дат и времени.
          example: Europe/Moscow
    SignInRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
          example: artem@example.com
        password:
          type: string
          format: password
          writeOnly: true
    AuthResponse:
      type: object
      additionalProperties: false
      required: [user, access_token, token_type, expires_in]
      properties:
        user:
          $ref: '#/components/schemas/User'
        access_token:
          type: string
          minLength: 1
          description: Токен для заголовка Authorization.
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
          format: int32
          minimum: 1
          description: Срок действия access token в секундах.
    User:
      type: object
      additionalProperties: false
      required: [id, name, email, timezone, created_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        timezone:
          type: string
          example: Europe/Moscow
        created_at:
          type: string
          format: date-time
    HealthResponse:
      type: object
      additionalProperties: false
      required: [service, status]
      properties:
        service:
          type: string
        status:
          type: string
          enum: [ok, unavailable]
    Problem:
      type: object
      description: Problem Details for HTTP APIs (RFC 9457) с дополнительным полем code.
      required:
        - type
        - title
        - status
        - code
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
  responses:
    TaskInternalError:
      description: |
        Сбой проверки сессии или обработки задачи, включая некорректные данные
        AI и сбой PostgreSQL. Причина логируется. При ошибке обработки задачи
        клиент получает нейтральное сообщение в detail.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://gorkycode.example/problems/internal-error
            title: Internal server error
            status: 500
            code: internal_error
            detail: Извините, возникли внутренние проблемы.
    BadRequest:
      description: Некорректный запрос
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PayloadTooLarge:
      description: WAV-файл превышает настроенный лимит размера
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    BadGateway:
      description: Ошибка STT или AI-service, включая некорректный JSON AI
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    GatewayTimeout:
      description: Таймаут STT или AI-service
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Неверный email или пароль; code = invalid_credentials.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://gorkycode.example/problems/invalid-credentials
            title: Invalid credentials
            status: 401
            code: invalid_credentials
    SessionRequired:
      description: Нет access token или сессия истекла либо завершена; code = unauthorized.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://gorkycode.example/problems/unauthorized
            title: Unauthorized
            status: 401
            code: unauthorized
    Forbidden:
      description: user_id в запросе не совпадает с владельцем Bearer-сессии; code = forbidden.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://gorkycode.example/problems/forbidden
            title: Forbidden
            status: 403
            code: forbidden
    NotFound:
      description: Ресурс не найден
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Конфликт запроса — устаревший выбор, занятый диалог или уже существующий пользователь.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unavailable:
      description: Сервис временно недоступен
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: Превышен лимит запросов; code = rate_limited.
      headers:
        Retry-After:
          description: Через сколько секунд можно повторить запрос.
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalError:
      description: Внутренняя ошибка сервера
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

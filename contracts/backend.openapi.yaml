            JSON имеет схему TaskCreatedResponse, data.event содержит
            фактическую запись PostgreSQL.
          headers:
            X-Task-Intent:
              description: Подтверждённое намерение создать запись.
              required: true
              schema:
                type: string
                enum: [create_event]
          content:

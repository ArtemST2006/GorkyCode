openapi: 3.0.3
info:
  title: GorkyCode Backend API
  version: 0.0.0
  description: HTTP API backend для клиентского приложения.
paths:
  /health:
    get:
      tags: [Service]
      summary: Liveness
      operationId: health
      responses:
        '200':
          description: Процесс работает
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /ready:
    get:
      tags: [Service]
      summary: Readiness
      operationId: ready
      responses:
        '200':
          description: Сервис готов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: PostgreSQL недоступен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/task:
    post:
      tags: [Tasks]
      summary: Обработать текстовую или голосовую команду
      operationId: processTask
      security:
        - bearerAuth: []
      description: |
        Требуется Bearer-токен действующей сессии. user_id в JSON или
        multipart/form-data должен совпадать с владельцем этой сессии.
        При первом запросе клиент не передаёт task_id: backend создаёт UUID и
        передаёт AI-service текст, время запроса, часовой пояс пользователя и
        пустой context. Для ответа на уточнение клиент повторяет запрос с
        полученным task_id; backend загружает context из Redis.
        Одновременные запросы с одним user_id и task_id не выполняются:
        пока первый обрабатывается, второй получает 409. Клиент ждёт ответ
        первого запроса и только затем отправляет следующую реплику.
        Ровно один источник команды: text в application/json или WAV-файл в
        multipart/form-data. Контекст, request_time и timezone клиент не
        передаёт. Backend вызывает STT только для аудио, проверяет ответ AI
        и выполняет разрешённое действие по intent. Ответ 201 подтверждает
        создание только после сохранения записи. Для списка и поиска используется
        ответ 200 с data.items. При ready/create_event агрегатор передаёт
        проверенный action внутреннему сервису создания. Только после записи
        в PostgreSQL возвращается 201 с полной созданной записью в data.event.
        task_id обозначает диалог, data.event.id — отдельный ID записи.
        Для задачи со сроком без точного времени data.event.time отсутствует;
        такая запись участвует в поиске и списках по дате, но не совпадает с
        фильтром по времени.
        В успешных ответах X-Task-Intent содержит проверенный intent AI.
        Для уточнения это намерение продолжающегося диалога. В ответах с
        ошибкой заголовок X-Task-Intent отсутствует.
        Для on_delete ready/find_candidates означает только поиск: backend
        возвращает все найденные записи со стабильными номерами, даже если
        кандидат один. Пустой список означает, что пользователь может
        уточнить признаки с тем же task_id. Фронтенд отправляет выбранный
        один или несколько номеров текстом в повторном запросе с тем же
        task_id. После явного подтверждения AI возвращает action.task_ids —
        ID строк PostgreSQL tasks. Backend проверяет каждый ID по сохранённым
        кандидатам и владельцу сессии, затем удаляет все выбранные записи
        одной транзакцией. Если запись исчезла или её содержимое изменилось
        после показа кандидатов, выбор считается устаревшим. Не удаляется
        ничего и возвращается 409. task_id обозначает ID диалога. Команда
        «все» до показа кандидатов не считается подтверждением удаления.
        on_update также сначала показывает кандидатов и предлагаемые changes.
        После явного выбора номеров backend сверяет сохранённые снимки строк,
        обновляет все выбранные записи одной транзакцией и возвращает их.
        Повторная обработка того же task_id не гарантирует идемпотентность.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskTextRequest'
            examples:
              firstRequest:
                summary: Первая команда
                value:
                  user_id: b80e93e1-9945-48e0-8460-3ee68bcfb402
                  text: Назначь встречу с Иваном завтра
              clarificationReply:
                summary: Ответ на уточняющий вопрос
                value:
                  user_id: b80e93e1-9945-48e0-8460-3ee68bcfb402
                  task_id: 7b612951-57ae-4ac4-a93c-42fa9c9e8359
                  text: 'В 15:00'
              dateOnlyTask:
                summary: Задача со сроком без точного времени
                value:
                  user_id: b80e93e1-9945-48e0-8460-3ee68bcfb402
                  text: Поставь задачу купить билеты до конца недели
              deleteSelection:
                summary: Подтверждение двух кандидатов на удаление
                value:
                  user_id: b80e93e1-9945-48e0-8460-3ee68bcfb402
                  task_id: 70ce187e-a2a6-4499-91a0-5c61e5920b51
                  text: Удали №1 и №5
              updateSelection:
                summary: Подтверждение изменения записи №1
                value:
                  user_id: b80e93e1-9945-48e0-8460-3ee68bcfb402
                  task_id: 98fa7a94-7473-40b2-8678-11d3c1662eed
                  text: Выбери №1
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TaskAudioRequest'
            encoding:
              file:
                contentType: audio/wav, audio/x-wav
      responses:
        '200':
          description: |
            При status=needs_clarification возвращается TaskClarificationResponse;
            X-Task-Intent показывает намерение диалога. При status=ok и
            X-Task-Intent=list_events или search_events возвращается
            TaskCollectionResponse. Отсутствие найденных записей — успешный
            ответ с data.items: []. Для on_delete status=candidates возвращает
            список для выбора, в том числе пустой; status=deleted подтверждает
            фактическое удаление всех выбранных записей. Для on_update
            status=update_candidates возвращает список и предлагаемые changes,
            status=updated — обновлённые записи. Сообщения о кандидатах и
            удалении формирует backend после обращения к PostgreSQL;
            при status=updated backend передаёт message от AI-service.
          headers:
            X-Task-Intent:
              description: Проверенный intent; при уточнении — намерение диалога.
              required: true
              schema:
                type: string
                enum: [create_event, list_events, search_events, on_delete, on_update]
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/TaskClarificationResponse'
                  - $ref: '#/components/schemas/TaskCollectionResponse'
                  - $ref: '#/components/schemas/TaskDeleteCandidatesResponse'
                  - $ref: '#/components/schemas/TasksDeletedResponse'
                  - $ref: '#/components/schemas/FrontendUpdateCandidates'
                  - $ref: '#/components/schemas/FrontendUpdated'
                discriminator:
                  propertyName: status
                  mapping:
                    needs_clarification: '#/components/schemas/TaskClarificationResponse'
                    ok: '#/components/schemas/TaskCollectionResponse'
                    candidates: '#/components/schemas/TaskDeleteCandidatesResponse'
                    deleted: '#/components/schemas/TasksDeletedResponse'
                    update_candidates: '#/components/schemas/FrontendUpdateCandidates'
                    updated: '#/components/schemas/FrontendUpdated'
              examples:
                needsClarification:
                  summary: Время встречи ещё не указано
                  value:
                    user_id: b80e93e1-9945-48e0-8460-3ee68bcfb402
                    task_id: 7b612951-57ae-4ac4-a93c-42fa9c9e8359
                    status: needs_clarification
                    message: В какое время?
                deleteNeedsClarification:
                  summary: Для удаления не хватает признаков; X-Task-Intent=on_delete
                  value:
                    user_id: b80e93e1-9945-48e0-8460-3ee68bcfb402
                    task_id: 70ce187e-a2a6-4499-91a0-5c61e5920b51
                    status: needs_clarification
                    message: Какую запись нужно удалить?
                listEvents:
                  summary: Список событий на завтра
                  value:
                    user_id: b80e93e1-9945-48e0-8460-3ee68bcfb402
                    task_id: 7b612951-57ae-4ac4-a93c-42fa9c9e8359
                    status: ok
                    message: Проверил события на завтра.
                    data:
                      items:
                        - id: 0e083fa1-c33e-4c44-85e6-5b977ae17808
                          user_id: b80e93e1-9945-48e0-8460-3ee68bcfb402
                          record_type: meeting

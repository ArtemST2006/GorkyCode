upstream api_backend {
    zone api_backend 64k;
    resolver 127.0.0.11 valid=5s ipv6=off;
    server backend:8080 resolve;
}

upstream ai_backend {
    zone ai_backend 64k;
    resolver 127.0.0.11 valid=5s ipv6=off;
    server ai-service:8090 resolve;
}

map $http_origin $cors_origin {
    default "";
    "http://localhost:8088" "http://localhost:8088";
    "http://localhost:8089" "http://localhost:8089";
}

server {
    listen 80;

    # Browser requests from the local frontend are allowed through the public API.
    add_header Access-Control-Allow-Origin $cors_origin always;
    add_header Access-Control-Allow-Methods "GET, POST, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
    add_header Vary "Origin" always;

    if ($request_method = OPTIONS) {
        return 204;
    }

    # /api/task accepts WAV uploads; keep this in sync with the backend limit.
    client_max_body_size 20m;

    location /api/v1/notifications/ {
        # WebSocket notifications: send the upgrade frames unchanged.
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A live notification connection may idle for hours.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://api_backend;
        proxy_read_timeout 240s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/(health|ready)$ {
        proxy_pass http://api_backend;
        proxy_read_timeout 240s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 8091;

    location / {
        proxy_pass http://ai_backend;
        proxy_read_timeout 180s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

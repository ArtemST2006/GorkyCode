name: gorkycode

services:
  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "0.0.0.0:${NGINX_PUBLIC_PORT:-8088}:80"
      - "127.0.0.1:${NGINX_AI_PORT:-8091}:8091"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/public:/usr/share/nginx/html:ro
    depends_on:
      backend:
        condition: service_started
      ai-service:
        condition: service_healthy

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      HTTP_ADDR: ":8080"
      AI_SERVICE_URL: "http://nginx:8091"
      DATABASE_URL: "postgres://${POSTGRES_USER:-gorkycode}:${POSTGRES_PASSWORD:-local_dev_only}@postgres:5432/${POSTGRES_DB:-gorkycode}?sslmode=disable"
      REDIS_URL: "redis://redis:6379/0"
      MODEL_PATH: "/app/model/asr-model"
      MODEL_URL: "https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-nemo-ctc-giga-am-v3-russian-2025-12-16.tar.bz2"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:-}"
      GOOGLE_REDIRECT_URL: "${GOOGLE_REDIRECT_URL:-http://localhost:8088/api/v1/integrations/google/callback}"
      GOOGLE_FRONTEND_REDIRECT: "${GOOGLE_FRONTEND_REDIRECT:-http://localhost:8088/}"
    volumes:
      - asr_model:/app/model
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  ai-service:
    build:
      context: ./ai-service
    restart: unless-stopped
    stop_grace_period: 180s
    ports:
      - "127.0.0.1:8090:8090"
    env_file:
      - path: ./ai-service/.env
        required: false
    environment:
      PORT: "8090"
      REDIS_URL: "redis://redis:6379/0"
      EMBEDDING_MODEL_PATH: "/opt/embedding-model"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: pgvector/pgvector:0.8.7-pg16-bookworm
    restart: unless-stopped
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-gorkycode}"
      POSTGRES_USER: "${POSTGRES_USER:-gorkycode}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-local_dev_only}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "0.0.0.0:${MAILPIT_WEB_PORT:-8025}:8025"
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
    environment:
      MP_SMTP_BIND_ADDR: 0.0.0.0:1025
      MP_UI_BIND_ADDR: 0.0.0.0:8025
    volumes:
      - mailpit_data:/data

volumes:
  postgres_data:
  asr_model:
  mailpit_data:

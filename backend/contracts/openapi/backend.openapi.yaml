openapi: 3.0.3
info:
  title: GorkyCode Backend API
  version: 0.0.0
  description: HTTP API backend для клиентского приложения.
paths:
  /health:
    get:
      tags: [Service]
      summary: Liveness
      operationId: health
      responses:
        '200':
          description: Процесс работает
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /ready:
    get:
      tags: [Service]
      summary: Readiness
      operationId: ready
      responses:
        '200':
          description: Сервис готов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: PostgreSQL недоступен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/v1/auth/sign-up:
    post:
      tags: [Auth]
      summary: Регистрация пользователя
      description: Создаёт пользователя и возвращает его данные. Email сравнивается без учёта регистра.
      operationId: authSignUp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignUpRequest'
      responses:
        '201':
          description: Пользователь создан и авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/auth/sign-in:
    post:
      tags: [Auth]
      summary: Вход по email и паролю
      description: Возвращает одинаковую ошибку при неизвестном email и неверном пароле.
      operationId: authSignIn
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignInRequest'
      responses:
        '200':
          description: Пользователь авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/example/sign-in:
    post:
      tags: [Examples]
      summary: Учебный пример вызова PostgreSQL через все слои backend
      description: Не выполняет аутентификацию и не выдаёт токен.
      operationId: signIn
      responses:
        '200':
          description: Тестовый запрос к репозиторию выполнен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExampleSignInResponse'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  schemas:
    SignUpRequest:
      type: object
      additionalProperties: false
      required: [name, email, password, timezone]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Отображаемое имя пользователя; строка из одних пробелов недопустима.
          example: Артём
        email:
          type: string
          format: email
          maxLength: 320
          description: Уникальный email; при регистрации пробелы по краям удаляются, регистр не учитывается.
          example: artem@example.com
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 15
          maxLength: 128
          description: Пароль передаётся только по HTTPS и никогда не возвращается в ответе.
        timezone:
          type: string
          description: Часовой пояс IANA для интерпретации относительных дат и времени.
          example: Europe/Moscow
    SignInRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
          example: artem@example.com
        password:
          type: string
          format: password
          writeOnly: true
    AuthResponse:
      type: object
      additionalProperties: false
      required: [user]
      properties:
        user:
          $ref: '#/components/schemas/User'
    User:
      type: object
      additionalProperties: false
      required: [id, name, email, timezone, created_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        timezone:
          type: string
          example: Europe/Moscow
        created_at:
          type: string
          format: date-time
    ExampleSignInResponse:
      type: object
      additionalProperties: false
      required: [repository_reached, authenticated]
      properties:
        repository_reached:
          type: boolean
          description: Результат тестового запроса к PostgreSQL.
        authenticated:
          type: boolean
          description: Всегда false; пример не выполняет вход пользователя.
    HealthResponse:
      type: object
      additionalProperties: false
      required: [service, status]
      properties:
        service:
          type: string
        status:
          type: string
          enum: [ok, unavailable]
    Problem:
      type: object
      description: Problem Details for HTTP APIs (RFC 9457) с дополнительным полем code.
      required:
        - type
        - title
        - status
        - code
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
  responses:
    BadRequest:
      description: Некорректный запрос
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Неверный email или пароль; code = invalid_credentials.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Unauthorized
            status: 401
            code: invalid_credentials
    NotFound:
      description: Ресурс не найден
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Конфликт запроса
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unavailable:
      description: Сервис временно недоступен
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: Превышен лимит запросов; code = rate_limited.
      headers:
        Retry-After:
          description: Через сколько секунд можно повторить запрос.
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalError:
      description: Внутренняя ошибка сервера
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

env: local
log_level: info
shutdown_timeout: 10s

http-server:
  read_header_timeout: 5s
  read_timeout: 60s
  write_timeout: 210s
  idle_timeout: 60s

database:
  max_conns: 10
  min_conns: 2
  max_conn_lifetime: 30m
  connect_timeout: 5s
  query_timeout: 3s

ars_model:
  num_threads: 2
  decoding_method: "greedy_search"
  provider: "cpu"

ai_service_url: "http://localhost:8090"

google:
  event_duration: 1h
